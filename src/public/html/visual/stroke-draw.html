<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SVG 路径描边绘画</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 24px;
      background: #0f172a;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #e2e8f0;
    }

    h1 { font-size: 18px; margin: 0; }
    .sub { font-size: 13px; color: #64748b; margin: -14px 0 0; }

    .canvas {
      width: 100%;
      max-width: 640px;
      background: #fff;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    svg { display: block; width: 100%; height: auto; }

    /* 所有描边路径统一：dashoffset 从满到 0 */
    .draw {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: var(--len);
      stroke-dashoffset: var(--len);
    }

    .playing .draw {
      animation: draw var(--dur, 1.4s) ease forwards var(--delay, 0s);
    }

    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }

    /* 上色：画完后淡入填充 */
    .fill-in {
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .playing .fill-in { opacity: 1; transition-delay: var(--delay, 1s); }

    .ctrl { display: flex; gap: 10px; }

    .ctrl button {
      padding: 10px 26px;
      border: 1px solid #475569;
      border-radius: 8px;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .ctrl button:hover { background: #334155; border-color: #67e8f9; }

    .tip {
      font-size: 12px;
      color: #475569;
      text-align: center;
      line-height: 1.9;
      max-width: 560px;
      margin: 0;
    }

    .tip code { color: #94a3b8; }
  </style>
</head>
<body>
  <h1>SVG 路径描边绘画</h1>
  <p class="sub">按路径长度依次"画"出图形，最后淡入填充上色</p>

  <div class="canvas">
    <svg id="art" viewBox="0 0 480 280" xmlns="http://www.w3.org/2000/svg">
      <!-- 天空填充 -->
      <rect class="fill-in" style="--delay: 2.6s" x="0" y="0" width="480" height="280" fill="#e0f2fe" />

      <!-- 山（填充后置） -->
      <path class="fill-in" style="--delay: 2.7s"
            d="M20 230 L140 90 L230 230 Z" fill="#a7f3d0" />
      <path class="fill-in" style="--delay: 2.8s"
            d="M170 230 L290 70 L430 230 Z" fill="#6ee7b7" />

      <!-- 山描边 -->
      <path class="draw" style="--len: 460; --dur: 1.1s; --delay: 0s"
            d="M20 230 L140 90 L230 230 Z" stroke="#059669" stroke-width="4" />
      <path class="draw" style="--len: 520; --dur: 1.2s; --delay: 0.5s"
            d="M170 230 L290 70 L430 230 Z" stroke="#047857" stroke-width="4" />

      <!-- 太阳 -->
      <circle class="draw" style="--len: 220; --dur: 0.9s; --delay: 1.2s"
              cx="390" cy="70" r="34" stroke="#f59e0b" stroke-width="4" />
      <g class="draw" style="--len: 160; --dur: 0.7s; --delay: 1.7s" stroke="#f59e0b" stroke-width="4">
        <path d="M390 18 V0" />
        <path d="M390 140 V122" />
        <path d="M338 70 H320" />
        <path d="M460 70 H442" />
        <path d="M353 33 L341 21" />
        <path d="M439 119 L427 107" />
        <path d="M427 33 L439 21" />
        <path d="M341 119 L353 107" />
      </g>

      <!-- 地平线 -->
      <path class="draw" style="--len: 480; --dur: 1s; --delay: 1.4s"
            d="M10 230 H470" stroke="#334155" stroke-width="3" />

      <!-- 小房子 -->
      <g class="draw" style="--len: 330; --dur: 1.2s; --delay: 2s"
         stroke="#7c3aed" stroke-width="4">
        <path d="M60 230 V170 H130 V230" />
        <path d="M50 174 L95 138 L140 174" />
        <path d="M82 230 V196 H108 V230" />
      </g>
      <rect class="fill-in" style="--delay: 3s" x="62" y="172" width="66" height="56" fill="#ddd6fe" />
      <path class="fill-in" style="--delay: 3.1s"
            d="M50 174 L95 138 L140 174 Z" fill="#c4b5fd" />

      <!-- 云 -->
      <g class="draw" style="--len: 300; --dur: 1s; --delay: 2.3s"
         stroke="#94a3b8" stroke-width="3.5">
        <path d="M70 60 a20 20 0 0 1 40 0 a16 16 0 0 1 30 6 h-96 a14 14 0 0 1 26 -6" />
      </g>
    </svg>
  </div>

  <div class="ctrl">
    <button id="replay">↻ 重新绘制</button>
  </div>

  <p class="tip">
    核心：路径用 <code>stroke-dasharray = 路径长度</code>、<code>stroke-dashoffset</code> 从该长度过渡到 0，
    即可逐段"画"出任意路径；用 <code>var(--delay)</code> 控制先后顺序。
  </p>

  <script>
    var art = document.getElementById('art');

    // 用 getTotalLength() 校准每条路径的真实长度（比手写更精确）
    function calibrate() {
      art.querySelectorAll('.draw').forEach(function (el) {
        var len = 0;
        // 可能是 path / circle / g（g 取子路径总长）
        if (typeof el.getTotalLength === 'function') {
          len = el.getTotalLength();
        } else {
          el.querySelectorAll('path').forEach(function (p) {
            len += p.getTotalLength();
          });
        }
        if (len > 0) el.style.setProperty('--len', Math.ceil(len));
      });
    }

    function play() {
      art.classList.remove('playing');
      calibrate();
      void art.getBoundingClientRect().width;   // 强制重排，重置动画
      art.classList.add('playing');
    }

    document.getElementById('replay').addEventListener('click', play);

    // 首次进入自动播放
    window.addEventListener('load', play);
  </script>
</body>
</html>
