<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>霓虹灯文字</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      padding: 24px;
      background:
        repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 34px),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 34px),
        #0a0a12;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #e2e8f0;
    }

    .sign {
      padding: 40px 56px;
      border: 3px solid rgba(244, 114, 182, 0.35);
      border-radius: 18px;
      background: rgba(244, 114, 182, 0.04);
      box-shadow: inset 0 0 40px rgba(244, 114, 182, 0.06);
      text-align: center;
    }

    .neon {
      margin: 0;
      font-size: clamp(34px, 7vw, 64px);
      font-weight: 800;
      letter-spacing: 6px;
      color: #fff;
      /* 三层 text-shadow 叠出发光 */
      text-shadow:
        0 0 7px #fff,
        0 0 16px #ff4fa3,
        0 0 34px #ff4fa3,
        0 0 70px #ff2d95;
      animation: flicker 4.5s linear infinite;
    }

    .neon.sub-neon {
      margin-top: 14px;
      font-size: clamp(15px, 2.6vw, 22px);
      font-weight: 600;
      letter-spacing: 12px;
      color: #a5f3fc;
      text-shadow:
        0 0 6px #fff,
        0 0 14px #22d3ee,
        0 0 30px #06b6d4;
      animation: flicker 6s linear infinite 0.8s;
    }

    /* 霓虹管闪烁：大部分时间亮，偶发瞬间熄灭 */
    @keyframes flicker {
      0%, 18%, 20%, 22%, 25%, 54%, 56%, 100% {
        opacity: 1;
        text-shadow:
          0 0 7px #fff,
          0 0 16px #ff4fa3,
          0 0 34px #ff4fa3,
          0 0 70px #ff2d95;
      }
      19%, 21%, 24% {
        opacity: 0.35;
        text-shadow: 0 0 4px rgba(255, 255, 255, 0.6);
      }
      55% {
        opacity: 0.55;
        text-shadow: 0 0 6px #ff4fa3;
      }
    }

    .ctrl {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .ctrl button {
      padding: 9px 20px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.7);
      color: #cbd5e1;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .ctrl button:hover { border-color: #ff4fa3; color: #ff9ecb; }
    .ctrl button.on {
      background: #ff2d95;
      border-color: #ff2d95;
      color: #fff;
      box-shadow: 0 0 18px rgba(255, 45, 149, 0.55);
    }

    .tip { font-size: 12px; color: #475569; margin: 0; text-align: center; line-height: 1.8; }
    .tip code { color: #94a3b8; }
  </style>
</head>
<body>
  <div class="sign">
    <p class="neon" id="main">OPEN LATE</p>
    <p class="neon sub-neon" id="sub">24H OPEN</p>
  </div>

  <div class="ctrl">
    <button id="toggle" class="on">闪烁动画：开</button>
    <button id="swap">换一组文案</button>
    <button id="color">换发光色</button>
  </div>

  <p class="tip">多层 <code>text-shadow</code> 由内到外叠加发光 · <code>@keyframes flicker</code> 模拟霓虹管偶发熄灭</p>

  <script>
    var main = document.getElementById('main');
    var sub = document.getElementById('sub');
    var toggle = document.getElementById('toggle');
    var animOn = true;

    var texts = [
      ['OPEN LATE', '24H OPEN'],
      ['你好，世界', 'HELLO WORLD'],
      ['霓虹之夜', 'NEON NIGHTS'],
      ['欢迎光临', 'WELCOME']
    ];
    var textIdx = 0;

    var palettes = [
      ['#ff4fa3', '#ff2d95', '#22d3ee'],   // 粉 + 青（默认）
      ['#fbbf24', '#f59e0b', '#84cc16'],   // 橙 + 绿
      ['#a78bfa', '#7c3aed', '#f472b6'],   // 紫 + 粉
      ['#38bdf8', '#0284c7', '#a3e635']    // 蓝 + 黄绿
    ];
    var colorIdx = 0;

    toggle.addEventListener('click', function () {
      animOn = !animOn;
      main.style.animationPlayState = animOn ? 'running' : 'paused';
      sub.style.animationPlayState = animOn ? 'running' : 'paused';
      toggle.textContent = '闪烁动画：' + (animOn ? '开' : '关');
      toggle.classList.toggle('on', animOn);
      if (!animOn) { main.style.opacity = 1; sub.style.opacity = 1; }
    });

    document.getElementById('swap').addEventListener('click', function () {
      textIdx = (textIdx + 1) % texts.length;
      main.textContent = texts[textIdx][0];
      sub.textContent = texts[textIdx][1];
    });

    document.getElementById('color').addEventListener('click', function () {
      colorIdx = (colorIdx + 1) % palettes.length;
      var p = palettes[colorIdx];
      document.documentElement.style.setProperty('--n1', p[0]);

      main.style.textShadow =
        '0 0 7px #fff, 0 0 16px ' + p[0] + ', 0 0 34px ' + p[0] + ', 0 0 70px ' + p[1];
      sub.style.textShadow =
        '0 0 6px #fff, 0 0 14px ' + p[2] + ', 0 0 30px ' + p[2] + ', 0 0 60px ' + p[2] + '';

      document.querySelector('.sign').style.borderColor = p[0] + '59';
      document.querySelector('.sign').style.boxShadow = 'inset 0 0 40px ' + p[0] + '14';
    });
  </script>
</body>
</html>
