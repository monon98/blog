<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>流星雨</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, #040714 0%, #0b1026 55%, #131a3a 100%);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .moon {
      position: fixed;
      top: 42px;
      right: 60px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fef9c3, #fde047 60%, #facc15);
      box-shadow: 0 0 50px rgba(253, 224, 71, 0.55), 0 0 110px rgba(253, 224, 71, 0.28);
      pointer-events: none;
    }

    .moon::after {
      content: "";
      position: absolute;
      top: -6px;
      left: -14px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #040714;
    }

    .hud {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      display: flex;
      gap: 14px;
      align-items: center;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 12px;
      color: #94a3b8;
      z-index: 2;
    }

    .hud label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .hud input { accent-color: #818cf8; width: 90px; }
    .hud b { color: #a5b4fc; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div class="moon"></div>
  <canvas id="c"></canvas>

  <div class="hud">
    <span>已划过 <b id="count">0</b></span>
    <label>密度 <input type="range" id="density" min="1" max="10" value="5" /></label>
  </div>

  <script>
    var canvas = document.getElementById('c');
    var ctx = canvas.getContext('2d');
    var W, H;
    var meteors = [];
    var stars = [];
    var count = 0;
    var density = 5;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      buildStars();
    }

    function buildStars() {
      stars = [];
      var n = Math.floor((W * H) / 5200);
      for (var i = 0; i < n; i++) {
        stars.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: Math.random() * 1.3 + 0.3,
          tw: Math.random() * Math.PI * 2,   // 闪烁相位
          sp: 0.4 + Math.random() * 1.2
        });
      }
    }

    function spawn() {
      // 从右上方往左下方划（约 215° 方向）
      var startX = W * 0.25 + Math.random() * W * 0.85;
      var startY = -40 - Math.random() * H * 0.25;
      var speed = 9 + Math.random() * 9;
      var angle = Math.PI * 0.72;   // 约 215°，左下方向

      meteors.push({
        x: startX,
        y: startY,
        vx: Math.cos(angle) * speed,
        vy: -Math.sin(angle) * speed * -1,   // 指向左下
        len: 90 + Math.random() * 150,
        life: 1,
        hue: Math.random() > 0.75 ? 200 : 45   // 少量蓝色流星
      });
    }

    // 固定角度：左下
    function spawn2() {
      var startX = W * 0.3 + Math.random() * W * 0.8;
      var startY = -60 - Math.random() * H * 0.3;
      var speed = 8 + Math.random() * 10;
      meteors.push({
        x: startX,
        y: startY,
        vx: -speed * 0.55,
        vy: speed * 0.85,
        len: 80 + Math.random() * 160,
        life: 1,
        hue: Math.random() > 0.72 ? 195 : 46
      });
      count++;
      document.getElementById('count').textContent = count;
    }

    function frame(t) {
      ctx.clearRect(0, 0, W, H);

      // 星星闪烁
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        var a = 0.35 + Math.sin(t / 700 * s.sp + s.tw) * 0.35;
        ctx.fillStyle = 'rgba(255,255,255,' + a.toFixed(2) + ')';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // 生成流星（密度 1~10 → 概率）
      if (Math.random() < density * 0.014) spawn2();

      // 流星
      for (var m = meteors.length - 1; m >= 0; m--) {
        var mt = meteors[m];
        mt.x += mt.vx;
        mt.y += mt.vy;

        var tx = mt.x - mt.vx * (mt.len / Math.hypot(mt.vx, mt.vy)) * 0.9;
        var ty = mt.y - mt.vy * (mt.len / Math.hypot(mt.vx, mt.vy)) * 0.9;

        // 渐变拖尾
        var grad = ctx.createLinearGradient(mt.x, mt.y, tx, ty);
        if (mt.hue === 46) {
          grad.addColorStop(0, 'rgba(255, 245, 200, 0.95)');
          grad.addColorStop(0.25, 'rgba(253, 224, 71, 0.55)');
        } else {
          grad.addColorStop(0, 'rgba(220, 240, 255, 0.95)');
          grad.addColorStop(0.25, 'rgba(125, 211, 252, 0.55)');
        }
        grad.addColorStop(1, 'rgba(255, 255, 255, 0)');

        ctx.strokeStyle = grad;
        ctx.lineWidth = 2.2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(mt.x, mt.y);
        ctx.lineTo(tx, ty);
        ctx.stroke();

        // 头部亮点
        ctx.fillStyle = 'rgba(255,255,255,0.95)';
        ctx.beginPath();
        ctx.arc(mt.x, mt.y, 1.8, 0, Math.PI * 2);
        ctx.fill();

        // 出界回收
        if (mt.x < -250 || mt.y > H + 250) meteors.splice(m, 1);
      }

      requestAnimationFrame(frame);
    }

    document.getElementById('density').addEventListener('input', function () {
      density = Number(this.value);
    });

    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
