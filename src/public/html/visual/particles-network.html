<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星座连线网络</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #05060f;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #e2e8f0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hud {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 16px;
      align-items: center;
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 12px;
      color: #94a3b8;
      backdrop-filter: blur(8px);
      z-index: 2;
    }

    .hud b { color: #67e8f9; font-variant-numeric: tabular-nums; }

    .tip {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: #475569;
      z-index: 2;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="hud">
    <span>节点 <b id="nodes">0</b></span>
    <span>连线 <b id="links">0</b></span>
    <span>连接距离 130px</span>
  </div>

  <canvas id="c"></canvas>

  <div class="tip">粒子间距离小于阈值即连线 · 鼠标靠近产生斥力并额外连线</div>

  <script>
    var canvas = document.getElementById('c');
    var ctx = canvas.getContext('2d');
    var W, H;

    var LINK_DIST = 130;       // 节点间连线阈值
    var MOUSE_DIST = 170;      // 鼠标连线阈值
    var nodes = [];
    var mouse = { x: -9999, y: -9999 };

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      init();
    }

    function init() {
      // 密度随面积自适应
      var count = Math.min(130, Math.floor((W * H) / 11000));
      nodes = [];
      for (var i = 0; i < count; i++) {
        nodes.push({
          x: Math.random() * W,
          y: Math.random() * H,
          vx: (Math.random() - 0.5) * 0.5,
          vy: (Math.random() - 0.5) * 0.5,
          r: 1.4 + Math.random() * 1.6
        });
      }
      document.getElementById('nodes').textContent = nodes.length;
    }

    window.addEventListener('resize', resize);
    canvas.addEventListener('mousemove', function (e) {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });
    canvas.addEventListener('mouseleave', function () {
      mouse.x = mouse.y = -9999;
    });

    function dist(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function frame() {
      ctx.fillStyle = 'rgba(5, 6, 15, 0.4)';   // 轻微拖尾
      ctx.fillRect(0, 0, W, H);

      var linkCount = 0;

      // 更新位置 + 斥力
      for (var i = 0; i < nodes.length; i++) {
        var n = nodes[i];

        // 鼠标斥力
        var dm = Math.hypot(n.x - mouse.x, n.y - mouse.y);
        if (dm < 120 && dm > 0.01) {
          var force = (120 - dm) / 120 * 1.6;
          n.vx += ((n.x - mouse.x) / dm) * force;
          n.vy += ((n.y - mouse.y) / dm) * force;
        }

        // 速度阻尼 + 上限
        n.vx *= 0.96;
        n.vy *= 0.96;
        var sp = Math.hypot(n.vx, n.vy);
        if (sp > 2.4) { n.vx = (n.vx / sp) * 2.4; n.vy = (n.vy / sp) * 2.4; }

        n.x += n.vx;
        n.y += n.vy;

        // 出界回弹
        if (n.x < 0) { n.x = 0; n.vx *= -1; }
        if (n.x > W) { n.x = W; n.vx *= -1; }
        if (n.y < 0) { n.y = 0; n.vy *= -1; }
        if (n.y > H) { n.y = H; n.vy *= -1; }
      }

      // 节点间连线
      for (var a = 0; a < nodes.length; a++) {
        for (var b = a + 1; b < nodes.length; b++) {
          var d = dist(nodes[a], nodes[b]);
          if (d < LINK_DIST) {
            ctx.strokeStyle = 'rgba(129, 140, 248,' + (1 - d / LINK_DIST) * 0.5 + ')';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(nodes[a].x, nodes[a].y);
            ctx.lineTo(nodes[b].x, nodes[b].y);
            ctx.stroke();
            linkCount++;
          }
        }
      }

      // 鼠标连线（青色）
      for (var k = 0; k < nodes.length; k++) {
        var dm2 = dist(nodes[k], mouse);
        if (dm2 < MOUSE_DIST) {
          ctx.strokeStyle = 'rgba(103, 232, 249,' + (1 - dm2 / MOUSE_DIST) * 0.8 + ')';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(mouse.x, mouse.y);
          ctx.lineTo(nodes[k].x, nodes[k].y);
          ctx.stroke();
          linkCount++;
        }
      }

      // 绘制节点
      for (var p = 0; p < nodes.length; p++) {
        ctx.fillStyle = '#c7d2fe';
        ctx.beginPath();
        ctx.arc(nodes[p].x, nodes[p].y, nodes[p].r, 0, Math.PI * 2);
        ctx.fill();
      }

      document.getElementById('links').textContent = linkCount;

      requestAnimationFrame(frame);
    }

    resize();
    frame();
  </script>
</body>
</html>
