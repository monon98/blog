<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文字逐词入场</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0b1120;
      color: #e2e8f0;
      line-height: 1.5;
    }

    .hero {
      min-height: 62vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      background: radial-gradient(80% 60% at 50% 0%, #1e1b4b 0%, transparent 70%);
    }

    .kicker {
      font-size: 12px;
      letter-spacing: 5px;
      color: #67e8f9;
      text-transform: uppercase;
      margin-bottom: 18px;
      opacity: 0;
      transition: opacity 0.6s ease 0.1s;
    }

    .kicker.show { opacity: 1; }

    h1 {
      margin: 0;
      font-size: clamp(30px, 6vw, 58px);
      font-weight: 800;
      max-width: 860px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0 0.32em;
      overflow: hidden;
      padding-bottom: 6px;
    }

    /* 每个词包一层 span 做裁剪容器 */
    .word-mask {
      display: inline-block;
      overflow: hidden;
      vertical-align: bottom;
      padding-bottom: 0.12em;
      margin-bottom: -0.12em;
    }

    .word {
      display: inline-block;
      transform: translateY(110%) rotate(4deg);
      opacity: 0;
      transition:
        transform 0.7s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.5s ease;
      transition-delay: var(--d, 0s);
    }

    .word-mask.show .word {
      transform: translateY(0) rotate(0);
      opacity: 1;
    }

    .desc {
      max-width: 560px;
      margin: 26px auto 0;
      font-size: 15px;
      line-height: 2;
      color: #94a3b8;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.8s ease 0.9s;
    }

    .desc.show { opacity: 1; transform: none; }

    .replay {
      margin-top: 30px;
      padding: 11px 28px;
      border: 1px solid #475569;
      border-radius: 999px;
      background: rgba(99, 102, 241, 0.16);
      color: #c7d2fe;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.25s;
      opacity: 0;
      transition: opacity 0.6s ease 1.3s, background 0.2s, transform 0.15s;
    }

    .replay.show { opacity: 1; }
    .replay:hover { background: rgba(99, 102, 241, 0.34); transform: translateY(-2px); }

    .scroll-hint {
      text-align: center;
      font-size: 13px;
      color: #475569;
      padding-bottom: 30px;
      animation: bob 1.6s ease-in-out infinite;
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(6px); }
    }

    .filler {
      min-height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      background: linear-gradient(180deg, transparent, #111831 40%, #111831 60%, transparent);
      color: #64748b;
      font-size: 14px;
      line-height: 2;
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="kicker" id="kicker">Scroll Reveal</div>

    <h1 id="title">把每一句话拆成词，逐个从下方浮现</h1>

    <p class="desc" id="desc">
      每个词被包在 overflow: hidden 的遮罩里，通过 translateY 从 110% 回到 0，
      配合递增的 transition-delay 形成依次入场的节奏。
    </p>

    <button class="replay" id="replay">↻ 重播动画</button>
  </section>

  <div class="scroll-hint">↓ 向下滚动查看第二段</div>

  <section class="filler">
    <p>
      IntersectionObserver 观察到目标进入视口后才添加 .show 类 ——<br />
      这就是滚动触发动画的核心，无需在 scroll 回调里反复计算位置。
    </p>
  </section>

  <script>
    var title = document.getElementById('title');

    // 1. 把标题拆成「词遮罩 + 词」结构（按字符分组，中文每 2 字一词更自然）
    function splitWords(el) {
      var text = el.textContent.trim();
      el.textContent = '';

      // 英文按空格分词，中文按 2 字分组
      var tokens = [];
      var buf = '';
      for (var i = 0; i < text.length; i++) {
        var ch = text[i];
        var isCJK = /[一-龥]/.test(ch);
        if (isCJK) {
          buf += ch;
          if (buf.length >= 2) { tokens.push(buf); buf = ''; }
        } else {
          if (buf) { tokens.push(buf); buf = ''; }
          if (ch === ' ') { tokens.push(' '); }
          else {
            var w = ch;
            while (i + 1 < text.length && !/[一-龥 ]/.test(text[i + 1])) {
              w += text[++i];
            }
            tokens.push(w);
          }
        }
      }
      if (buf) tokens.push(buf);

      tokens.forEach(function (t, i) {
        if (t === ' ') {
          el.appendChild(document.createTextNode(' '));
          return;
        }
        var mask = document.createElement('span');
        mask.className = 'word-mask';
        var word = document.createElement('span');
        word.className = 'word';
        word.textContent = t;
        word.style.setProperty('--d', (i * 0.07).toFixed(2) + 's');
        mask.appendChild(word);
        el.appendChild(mask);
      });

      return el.querySelectorAll('.word-mask');
    }

    var masks = splitWords(title);

    function play() {
      // 先移除类，强制重排后再加回，保证可重播
      masks.forEach(function (m) { m.classList.remove('show'); });
      ['kicker', 'desc', 'replay'].forEach(function (id) {
        document.getElementById(id).classList.remove('show');
      });
      void title.offsetWidth;

      document.getElementById('kicker').classList.add('show');
      masks.forEach(function (m, i) {
        setTimeout(function () { m.classList.add('show'); }, 150 + i * 70);
      });
      document.getElementById('desc').classList.add('show');
      document.getElementById('replay').classList.add('show');
    }

    // 进入视口触发（首屏直接播放）
    var played = false;
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting && !played) {
          played = true;
          play();
        }
      });
    }, { threshold: 0.3 });
    io.observe(document.querySelector('.hero'));

    document.getElementById('replay').addEventListener('click', play);
  </script>
</body>
</html>
