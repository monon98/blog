<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>波点矩阵涟漪</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px;
      background: #0a0e1a;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #e2e8f0;
    }

    h1 { font-size: 18px; margin: 0; }
    .sub { font-size: 13px; color: #64748b; margin: -12px 0 0; text-align: center; }

    .board {
      position: relative;
      width: 100%;
      max-width: 760px;
      height: 400px;
      border-radius: 16px;
      overflow: hidden;
      background:
        radial-gradient(120% 100% at 50% 0%, #111a33 0%, #0a0e1a 70%);
      border: 1px solid rgba(148, 163, 184, 0.18);
      cursor: crosshair;
    }

    .dots {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(24, 1fr);
      grid-template-rows: repeat(13, 1fr);
      place-items: center;
      padding: 8px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #334155;
      /* --k 由 JS 写入：0（远）→ 1（近） */
      transform: scale(calc(1 + var(--k, 0) * 2.6));
      background: rgb(
        calc(51 + var(--k, 0) * 96),
        calc(65 + var(--k, 0) * 140),
        calc(85 + var(--k, 0) * 165)
      );
      box-shadow: 0 0 calc(var(--k, 0) * 14px) rgba(56, 189, 248, calc(var(--k, 0) * 0.9));
      transition: transform 0.12s ease-out, background 0.12s ease-out, box-shadow 0.12s ease-out;
    }

    /* 点击扩散的涟漪环 */
    .ripple {
      position: absolute;
      border: 2px solid rgba(56, 189, 248, 0.8);
      border-radius: 50%;
      width: 20px;
      height: 20px;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: none;
      animation: ripple 0.9s ease-out forwards;
    }

    @keyframes ripple {
      to {
        transform: translate(-50%, -50%) scale(16);
        opacity: 0;
      }
    }

    .readout {
      font-size: 12px;
      font-family: ui-monospace, Menlo, monospace;
      color: #64748b;
      min-height: 18px;
    }

    .readout b { color: #38bdf8; }
  </style>
</head>
<body>
  <h1>波点矩阵涟漪</h1>
  <p class="sub">鼠标靠近的波点放大点亮，点击产生扩散环（距离 → CSS 变量驱动）</p>

  <div class="board" id="board">
    <div class="dots" id="dots"></div>
  </div>

  <div class="readout" id="readout">移动鼠标到矩阵上…</div>

  <script>
    var COLS = 24;
    var ROWS = 13;
    var RADIUS = 130;

    var board = document.getElementById('board');
    var dotsWrap = document.getElementById('dots');
    var readout = document.getElementById('readout');

    var dots = [];
    for (var i = 0; i < COLS * ROWS; i++) {
      var d = document.createElement('div');
      d.className = 'dot';
      dotsWrap.appendChild(d);
      dots.push(d);
    }

    // 缓存格子中心（相对 board），窗口尺寸变化时重算
    var centers = [];
    function measure() {
      var rect = board.getBoundingClientRect();
      centers = dots.map(function (dot) {
        var r = dot.getBoundingClientRect();
        return {
          x: r.left - rect.left + r.width / 2,
          y: r.top - rect.top + r.height / 2
        };
      });
    }

    var lit = 0;

    board.addEventListener('mousemove', function (e) {
      if (!centers.length) measure();

      var rect = board.getBoundingClientRect();
      var mx = e.clientX - rect.left;
      var my = e.clientY - rect.top;

      lit = 0;
      for (var i = 0; i < dots.length; i++) {
        var c = centers[i];
        var dist = Math.hypot(c.x - mx, c.y - my);

        if (dist < RADIUS) {
          var k = 1 - dist / RADIUS;      // 越近 k 越大
          dots[i].style.setProperty('--k', k.toFixed(3));
          lit++;
        } else if (dots[i].style.getPropertyValue('--k') !== '0') {
          dots[i].style.setProperty('--k', '0');
        }
      }

      readout.innerHTML = '点亮 <b>' + lit + '</b> / ' + dots.length + ' 个波点';
    });

    board.addEventListener('mouseleave', function () {
      dots.forEach(function (d) { d.style.setProperty('--k', '0'); });
      readout.textContent = '移动鼠标到矩阵上…';
    });

    board.addEventListener('click', function (e) {
      var rect = board.getBoundingClientRect();
      var ring = document.createElement('div');
      ring.className = 'ripple';
      ring.style.left = (e.clientX - rect.left) + 'px';
      ring.style.top = (e.clientY - rect.top) + 'px';
      board.appendChild(ring);
      setTimeout(function () { ring.remove(); }, 950);
    });

    window.addEventListener('resize', function () { centers = []; });
  </script>
</body>
</html>
