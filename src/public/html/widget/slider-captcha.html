<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>滑块拼图验证码</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      background: #f1f5f9;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #1e293b;
    }

    h1 { font-size: 16px; margin: 0; }

    .captcha {
      width: 320px;
      background: #fff;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.1);
      user-select: none;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 160px;
      border-radius: 8px;
      overflow: hidden;
      background-size: cover;
    }

    /* 拼图缺口 */
    .hole {
      position: absolute;
      top: 34px;
      width: 46px;
      height: 46px;
      background: rgba(15, 23, 42, 0.42);
      border: 2px solid rgba(255, 255, 255, 0.85);
      border-radius: 6px;
      box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.35);
    }

    /* 拼图块：内容取自缺口处，随拖动平移 */
    .piece {
      position: absolute;
      top: 34px;
      left: 0;
      width: 46px;
      height: 46px;
      background-size: 320px 160px;
      border: 2px solid #fff;
      border-radius: 6px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
      z-index: 2;
    }

    .piece.dragging { cursor: grabbing; }

    /* 滑轨 */
    .track {
      position: relative;
      margin-top: 14px;
      height: 44px;
      background: #eef2f7;
      border-radius: 999px;
      overflow: hidden;
    }

    .fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0;
      background: linear-gradient(90deg, #22c55e, #4ade80);
      opacity: 0.35;
    }

    .handle {
      position: absolute;
      left: 0;
      top: 3px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #fff;
      border: 1px solid #cbd5e1;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      font-size: 15px;
      z-index: 3;
    }

    .handle:active { cursor: grabbing; }

    .track-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: #94a3b8;
      pointer-events: none;
    }

    .status {
      margin-top: 10px;
      font-size: 13px;
      text-align: center;
      min-height: 20px;
      color: #64748b;
    }

    .status.ok { color: #16a34a; font-weight: 600; }
    .status.err { color: #dc2626; font-weight: 600; }

    .reset {
      padding: 6px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
      font-size: 13px;
      cursor: pointer;
    }

    .reset:hover { border-color: #2563eb; color: #2563eb; }
  </style>
</head>
<body>
  <h1>滑块拼图验证码</h1>

  <div class="captcha">
    <div class="stage" id="stage">
      <div class="hole" id="hole"></div>
      <div class="piece" id="piece"></div>
    </div>

    <div class="track" id="track">
      <div class="fill" id="fill"></div>
      <div class="track-text" id="trackText">按住滑块，拖动完成拼图</div>
      <div class="handle" id="handle">→</div>
    </div>

    <div class="status" id="status">等待验证…</div>
  </div>

  <button class="reset" id="reset">换一张</button>

  <script>
    var PIECE = 46;
    var TOLERANCE = 6;      // 允许误差
    var stage = document.getElementById('stage');
    var hole = document.getElementById('hole');
    var piece = document.getElementById('piece');
    var track = document.getElementById('track');
    var fill = document.getElementById('fill');
    var handle = document.getElementById('handle');
    var trackText = document.getElementById('trackText');
    var statusEl = document.getElementById('status');

    var targetX = 0;        // 缺口位置
    var currentX = 0;       // 拼图当前位置
    var dragging = false;
    var solved = false;

    // 生成自包含背景（SVG 渐变），不依赖外部图片
    function makeBg() {
      var svg =
        '<svg xmlns="http://www.w3.org/2000/svg" width="320" height="160">' +
        '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0%" stop-color="#1e3a8a"/>' +
        '<stop offset="50%" stop-color="#0e7490"/>' +
        '<stop offset="100%" stop-color="#7c3aed"/>' +
        '</linearGradient></defs>' +
        '<rect width="320" height="160" fill="url(#g)"/>' +
        '<circle cx="70" cy="45" r="30" fill="rgba(255,255,255,0.25)"/>' +
        '<circle cx="250" cy="115" r="46" fill="rgba(255,255,255,0.16)"/>' +
        '<rect x="140" y="20" width="70" height="70" rx="12" fill="rgba(255,255,255,0.2)"/>' +
        '<path d="M0 130 Q80 100 160 130 T320 130 V160 H0 Z" fill="rgba(255,255,255,0.14)"/>' +
        '</svg>';
      return 'url("data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg) + '")';
    }

    function init() {
      solved = false;
      dragging = false;
      currentX = 0;

      var bg = makeBg();
      stage.style.backgroundImage = bg;
      piece.style.backgroundImage = bg;

      // 缺口在 60 ~ 250 之间随机
      targetX = 60 + Math.floor(Math.random() * 190);
      hole.style.left = targetX + 'px';
      // 拼图块显示缺口处的内容
      piece.style.backgroundPosition = -targetX + 'px -34px';

      piece.style.left = '0px';
      handle.style.left = '0px';
      fill.style.width = '0px';
      trackText.style.opacity = '1';

      statusEl.className = 'status';
      statusEl.textContent = '等待验证…';
    }

    function maxDrag() {
      return stage.clientWidth - PIECE;
    }

    function setX(x) {
      currentX = Math.max(0, Math.min(maxDrag(), x));
      piece.style.left = currentX + 'px';

      var ratio = currentX / maxDrag();
      var travel = track.clientWidth - handle.offsetWidth;
      handle.style.left = ratio * travel + 'px';
      fill.style.width = ratio * travel + handle.offsetWidth / 2 + 'px';
      trackText.style.opacity = ratio > 0.04 ? '0' : '1';
    }

    function startDrag(e) {
      if (solved) return;
      dragging = true;
      piece.classList.add('dragging');
      e.preventDefault();
    }

    function onMove(e) {
      if (!dragging) return;
      var clientX = e.touches ? e.touches[0].clientX : e.clientX;

      var trackRect = track.getBoundingClientRect();
      var travel = track.clientWidth - handle.offsetWidth;
      var ratio = (clientX - trackRect.left - handle.offsetWidth / 2) / travel;
      ratio = Math.max(0, Math.min(1, ratio));

      setX(ratio * maxDrag());
      e.preventDefault();
    }

    function endDrag() {
      if (!dragging) return;
      dragging = false;
      piece.classList.remove('dragging');
      check();
    }

    function check() {
      var diff = Math.abs(currentX - targetX);

      if (diff <= TOLERANCE) {
        solved = true;
        statusEl.className = 'status ok';
        statusEl.textContent = '✓ 验证通过（误差 ' + diff.toFixed(1) + 'px）';
        trackText.textContent = '验证通过';
        trackText.style.opacity = '1';
        fill.style.width = track.clientWidth + 'px';
      } else {
        statusEl.className = 'status err';
        statusEl.textContent = '✗ 未对齐，误差 ' + diff.toFixed(1) + 'px，请重试';
        // 回弹
        piece.style.transition = 'left .3s ease';
        handle.style.transition = 'left .3s ease';
        fill.style.transition = 'width .3s ease';
        setX(0);
        setTimeout(function () {
          piece.style.transition = '';
          handle.style.transition = '';
          fill.style.transition = '';
        }, 320);
      }
    }

    handle.addEventListener('mousedown', startDrag);
    handle.addEventListener('touchstart', startDrag, { passive: false });
    document.addEventListener('mousemove', onMove);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('mouseup', endDrag);
    document.addEventListener('touchend', endDrag);

    document.getElementById('reset').addEventListener('click', init);

    init();
  </script>
</body>
</html>
